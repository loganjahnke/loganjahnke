<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logan Jahnke</title>
    <meta name="description" content="Logan Jahnke — personal portfolio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f6f5f2;
        --fg: #141414;
        --muted: #6b6b6b;
        --line: #d9d7d2;
        --chip: #ffffff;
        --chip-hover: #141414;
        --chip-hover-fg: #f6f5f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111111;
          --fg: #f2f1ee;
          --muted: #9a9a9a;
          --line: #2c2c2c;
          --chip: #1a1a1a;
          --chip-hover: #f2f1ee;
          --chip-hover-fg: #111111;
        }
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1rem, 3vh, 2rem);
        padding: 1.5rem 1rem;
        text-align: center;
      }

      .headshot {
        width: clamp(140px, 30vh, 240px);
        aspect-ratio: 1;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 30%;
        border: 1px solid var(--line);
      }

      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 500;
        font-size: clamp(2rem, 6vh, 3.25rem);
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      .tagline {
        color: var(--muted);
        font-size: clamp(0.95rem, 2.2vh, 1.125rem);
        max-width: 36ch;
        line-height: 1.5;
      }

      nav ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.625rem;
        max-width: 560px;
      }

      nav a {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--chip);
        color: var(--fg);
        text-decoration: none;
        font-size: 0.925rem;
        font-weight: 500;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }

      nav a:hover,
      nav a:focus-visible {
        background: var(--chip-hover);
        color: var(--chip-hover-fg);
        border-color: var(--chip-hover);
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="headshot" src="/img/logan.jpeg" alt="Logan Jahnke" width="240" height="240">
      <h1>Logan Jahnke</h1>
      <p class="tagline">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      <nav aria-label="Links">
        <ul>
          <!-- TODO: replace with your LinkedIn profile URL -->
          <li><a href="https://www.linkedin.com/in/YOUR-HANDLE" target="_blank" rel="noopener">LinkedIn</a></li>
          <li><a href="https://spartanrecord.com" target="_blank" rel="noopener">SpartanRecord</a></li>
          <li><a href="https://warpt.app" target="_blank" rel="noopener">Warpt</a></li>
          <li><a href="/pts/">Pts</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
